name: UWP Next Release

on:
  workflow_dispatch:
  schedule:
    - cron: "23 */6 * * *"

permissions:
  contents: write

concurrency:
  group: uwp-next-release
  cancel-in-progress: false

jobs:
  release:
    uses: YTReviveMe/OpenCE-UWP/.github/workflows/uwp-auto.yml@UWP-Auto
    with:
      publish: true
      minimum_build: 148
      one_shot: true
    secrets: inherit
